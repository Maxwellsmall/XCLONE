<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body
    style="margin: 0; padding: 0; background-color: #f7f9fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <table width="100%" border="0" cellspacing="0" cellpadding="0" style="background-color: #f7f9fa; padding: 24px 0;">
        <tr>
            <td align="center">
                <table width="100%" border="0" cellspacing="0" cellpadding="0"
                    style="max-width: 520px; background-color: #ffffff; border-radius: 16px; overflow: hidden; border: 1px solid #eff3f4;">

                    <!-- Logo Header -->
                    <tr>
                        <td style="padding: 24px 32px 12px 32px;">
                            <h1 style="margin: 0; color: #1d9bf0; font-size: 22px; font-weight: 800;">X Clone</h1>
                        </td>
                    </tr>

                    <!-- Dynamic Body Content -->
                    <tr>
                        <td style="padding: 12px 32px 32px 32px; color: #0f1419; font-size: 15px; line-height: 1.5;">
                            {% block content %}{% endblock %}
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td
                            style="padding: 20px 32px; background-color: #f7f9fa; border-top: 1px solid #eff3f4; text-align: center; color: #536471; font-size: 12px;">
                            <p style="margin: 0 0 4px 0;">Sent by X Clone</p>
                            <p style="margin: 0;">&copy; {% now "Y" %} X Clone. All rights reserved.</p>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>

</html>
