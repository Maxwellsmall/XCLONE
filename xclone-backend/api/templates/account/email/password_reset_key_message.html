{% extends "emails/base_email.html" %}

{% block content %}
<h2 style="margin-top: 0; color: #0f1419; font-size: 18px;">Reset your password</h2>
<p style="color: #536471;">We received a request to reset the password for your X Clone account.</p>

<table border="0" cellspacing="0" cellpadding="0" style="margin: 24px 0;">
    <tr>
        <td align="center" style="border-radius: 9999px; background-color: #1d9bf0;">
            <a href="{{ password_reset_url }}" target="_blank"
                style="font-size: 14px; font-weight: bold; color: #ffffff; text-decoration: none; border-radius: 9999px; padding: 12px 24px; display: inline-block;">
                Reset Password
            </a>
        </td>
    </tr>
</table>
<p style="font-size: 12px; color: #536471;">This link will expire automatically.</p>
{% endblock %}
